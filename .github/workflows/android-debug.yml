name: Build Bartenders Bible Android

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        working-directory: mobile
        run: |
          if [ ! -d android ]; then
            flutter create . --platforms=android
          fi
          rm -f test/widget_test.dart

      - name: Install persistent debug signing key
        working-directory: mobile
        run: |
          mkdir -p "$HOME/.android"
          cp signing/bartenders-bible-debug.keystore "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Configure Android and Play upload signing
        working-directory: mobile
        env:
          BB_UPLOAD_KEYSTORE_BASE64: ${{ secrets.BB_UPLOAD_KEYSTORE_BASE64 }}
          BB_UPLOAD_STORE_PASSWORD: ${{ secrets.BB_UPLOAD_STORE_PASSWORD }}
          BB_UPLOAD_KEY_PASSWORD: ${{ secrets.BB_UPLOAD_KEY_PASSWORD }}
          BB_UPLOAD_KEY_ALIAS: ${{ secrets.BB_UPLOAD_KEY_ALIAS }}
        run: |
          test -n "$BB_UPLOAD_KEYSTORE_BASE64"
          test -n "$BB_UPLOAD_STORE_PASSWORD"
          test -n "$BB_UPLOAD_KEY_PASSWORD"
          test -n "$BB_UPLOAD_KEY_ALIAS"
          python3 ../.github/scripts/configure_android.py

      - name: Get packages
        working-directory: mobile
        run: flutter pub get

      - name: Generate launcher icons
        working-directory: mobile
        run: dart run flutter_launcher_icons

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Build APK
        working-directory: mobile
        run: flutter build apk --debug

      - name: Build Play AAB
        working-directory: mobile
        run: flutter build appbundle --release

      - name: Verify AAB signature
        working-directory: mobile
        run: jarsigner -verify -verbose -certs build/app/outputs/bundle/release/app-release.aab

      - name: Name Android outputs
        run: |
          mkdir -p artifacts
          cp mobile/build/app/outputs/flutter-apk/app-debug.apk artifacts/Bartenders_Bible.apk
          cp mobile/build/app/outputs/bundle/release/app-release.aab artifacts/Bartenders_Bible.aab

      - name: Upload Android builds
        uses: actions/upload-artifact@v4
        with:
          name: Bartenders_Bible_Android
          path: |
            artifacts/Bartenders_Bible.apk
            artifacts/Bartenders_Bible.aab
